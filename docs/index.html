<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyward Spire</title>
<style>
  :root {
    --bg: #0f1224;
    --card: #171b35;
    --text: #e8ecff;
    --muted: #aab3dd;
    --accent: #ffc84a;
    --accent-2: #7db8ff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.2rem;
    color: var(--text);
    background:
      radial-gradient(1000px 500px at 0% -10%, #2a3268 0%, transparent 60%),
      radial-gradient(900px 450px at 100% 110%, #283f77 0%, transparent 60%),
      var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55;
  }

  .card {
    width: min(760px, 100%);
    background: linear-gradient(170deg, rgba(255,255,255,.06), rgba(255,255,255,.01));
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 18px;
    padding: 2rem;
    box-shadow: 0 16px 40px rgba(0,0,0,.35);
    backdrop-filter: blur(2px);
  }

  h1 {
    margin: 0;
    color: var(--accent);
    font-size: clamp(2rem, 4vw, 2.6rem);
    letter-spacing: .3px;
  }

  .meta { color: var(--muted); margin-top: .35rem; margin-bottom: 1.7rem; }

  h2 { margin: 1.3rem 0 .6rem; color: var(--accent-2); font-size: 1.1rem; }

  a { color: #9fd0ff; }
  a:hover { color: #c2e0ff; }

  ul { margin: 0; padding-left: 1.2rem; }
  li { margin: .35rem 0; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    text-decoration: none;
    padding: .55rem .95rem;
    border-radius: 999px;
    border: 1px solid rgba(159,208,255,.45);
    background: rgba(125,184,255,.12);
    font-weight: 600;
  }

  .pill:hover { background: rgba(125,184,255,.2); }
</style>
</head>
<body>
  <main class="card">
    <h1>Skyward Spire</h1>
    <p class="meta">Stack blocks skyward in a minimalist 3D tower challenge.</p>

    <h2>Legal</h2>
    <ul>
      <li><a class="pill" href="privacy_policy.html">📄 Privacy Policy</a></li>
    </ul>

    <h2>Contact</h2>
    <p>Support &amp; privacy inquiries:
    <a href="mailto:skywardspire.privacy@gmail.com">skywardspire.privacy@gmail.com</a></p>
  </main>
</body>
</html>
